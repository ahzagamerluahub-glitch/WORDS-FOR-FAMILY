<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Keluarga Tersayang ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --pink: #ff4d6d; --blue: #2196f3; --purple: #9c27b0; --orange: #ff9800; --green: #4caf50; --teal: #009688; --red: #f44336; --indigo: #3f51b5; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%); background-size: 400% 400%; animation: gradientBG 10s ease infinite; min-height: 100vh; padding: 20px; }
    @keyframes gradientBG { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .container { max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
    .card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); padding: 40px 30px; border-radius: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: center; animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .title { font-size: 2rem; font-weight: 700; background: linear-gradient(45deg, var(--pink), #ff8a80); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .api-section { background: #f5f5f5; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
    .api-section input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; font-family: inherit; transition: 0.3s; }
    .api-section input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 10px rgba(255,77,109,0.2); }
    .api-section small { color: #666; font-size: 12px; display: block; margin-top: 8px; }
    .message-box { min-height: 150px; padding: 25px; background: linear-gradient(135deg, rgba(255,77,109,0.1), rgba(33,150,243,0.1)); border-radius: 20px; border-left: 4px solid var(--pink); margin-bottom: 25px; font-size: 1.1rem; line-height: 1.8; color: #333; transition: all 0.3s ease; }
    .message-box.loading { opacity: 0.7; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 0.4; } }
    .message-box.error { border-left-color: var(--red); background: rgba(244,67,54,0.1); }
    .message-box.success { border-left-color: var(--green); background: rgba(76,175,80,0.1); }
    .family-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .fam-btn { padding: 15px 10px; border: none; border-radius: 15px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .fam-btn:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
    .fam-btn:active { transform: translateY(-2px); }
    .fam-btn i { font-size: 1.3rem; }
    .btn-mama { background: linear-gradient(45deg, var(--pink), #ff8a80); }
    .btn-papa { background: linear-gradient(45deg, var(--blue), #21cbf3); }
    .btn-kakak { background: linear-gradient(45deg, var(--purple), #ba68c8); }
    .btn-adik { background: linear-gradient(45deg, var(--green), #81c784); }
    .btn-oma { background: linear-gradient(45deg, var(--orange), #ffb74d); }
    .btn-opa { background: linear-gradient(45deg, var(--teal), #4db6ac); }
    .btn-bibi { background: linear-gradient(45deg, var(--red), #ef5350); }
    .btn-om { background: linear-gradient(45deg, var(--indigo), #7986cb); }
    .heart-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .heart-float { position: absolute; font-size: 20px; animation: fall 6s linear infinite; opacity: 0; }
    @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
    .note { margin-top: 20px; font-size: 0.85rem; color: #666; font-style: italic; }
    @media (max-width: 500px) { .family-grid { grid-template-columns: repeat(2, 1fr); } .card { padding: 30px 20px; } .title { font-size: 1.6rem; } }
  </style>
</head>
<body>
  <div class="heart-bg" id="heartsContainer"></div>
  <div class="container">
    <div class="card">
      <h1 class="title">Untuk Keluarga ❤️</h1>
      <div class="api-section">
        <input type="password" id="apiKey" placeholder="Masukkan API Key OpenAI..." />
        <small>💡 AI otomatis 生成 pesan untuk keluarga!</small>
      </div>
      <div class="message-box" id="messageBox">
        Hai keluarga tersayang...<br><br>Klik tombol di bawah untuk 生成 pesan dari AI! ❤️
      </div>
      <div class="family-grid">
        <button class="fam-btn btn-mama" onclick="generateMsg('Mama', this)"><i class="fas fa-heart"></i> Mama</button>
        <button class="fam-btn btn-papa" onclick="generateMsg('Papa', this)"><i class="fas fa-heart"></i> Papa</button>
        <button class="fam-btn btn-kakak" onclick="generateMsg('Kakak', this)"><i class="fas fa-user"></i> Kakak</button>
        <button class="fam-btn btn-adik" onclick="generateMsg('Adik', this)"><i class="fas fa-child"></i> Adik</button>
        <button class="fam-btn btn-oma" onclick="generateMsg('Oma', this)"><i class="fas fa-dove"></i> Oma</button>
        <button class="fam-btn btn-opa" onclick="generateMsg('Opa', this)"><i class="fas fa-dove"></i> Opa</button>
        <button class="fam-btn btn-bibi" onclick="generateMsg('Bibi', this)"><i class="fas fa-female"></i> Bibi</button>
        <button class="fam-btn btn-om" onclick="generateMsg('Om', this)"><i class="fas fa-male"></i> Om</button>
      </div>
      <p class="note">💝 Pesan dibuat otomatis oleh AI ❤️</p>
    </div>
  </div>
  <script>
    const hearts = ['❤️', '💖', '💕', '💗', '💓', '💞', '💘', '💝', '💟'];
    function createHeart() {
      const el = document.createElement('div');
      el.className = 'heart-float';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (Math.random() * 4 + 4) + 's';
      el.style.fontSize = (Math.random() * 15 + 15) + 'px';
      document.getElementById('heartsContainer').appendChild(el);
      setTimeout(() => el.remove(), 8000);
    }
    setInterval(createHeart, 400);
    for(let i = 0; i < 8; i++) { setTimeout(createHeart, i * 500); }
    
    async function generateMsg(familyMember, btnElement) {
      const apiKey = document.getElementById('apiKey').value.trim();
      const msgBox = document.getElementById('messageBox');
      
      if (!apiKey) {
        msgBox.innerHTML = '⚠️ <strong>Masukkan API Key dulu!</strong><br><br>Get key di: <a href="https://platform.openai.com" target="_blank">platform.openai.com</a>';
        msgBox.className = 'message-box error';
        return;
      }
      
      msgBox.className = 'message-box loading';
      msgBox.innerHTML = '⏳ AI sedang生成 pesan untuk <strong>' + familyMember + '</strong>...<br><br>Tunggu ya...';
      
      try {
        // ✅ PAKE MODEL YANG BENAR: gpt-4o-mini atau gpt-3.5-turbo
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': 'Bearer ' + apiKey 
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',  // ✅ MODEL BENAR!
            messages: [{ 
              role: 'user', 
              content: 'Buat pesan menyentuh hati untuk ' + familyMember + ' dalam bahasa Indonesia informal dan penuh cinta. Pakai banyak emoji. 4-5 paragraf yang bisa membuat dia menangis bahagia dan merasa sangat disayang. Ungkapan rasa syukur, maaf jika pernah menyakiti, dan seberapa pentingnya dia dalam hidupmu.'
            }],
            max_tokens: 600, 
            temperature: 0.9
          })
        });
        
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }
        
        msgBox.className = 'message-box success';
        msgBox.innerHTML = data.choices[0].message.content;
        
      } catch (err) {
        msgBox.className = 'message-box error';
        msgBox.innerHTML = '❌ <strong>Error!</strong><br><br>' + err.message + '<br><br>💡 Cek API Key kamu!';
      }
    }
    
    document.getElementById('apiKey').addEventListener('change', function() {
      localStorage.setItem('family_msg_api_key', this.value);
    });
    window.addEventListener('load', function() {
      const savedKey = localStorage.getItem('family_msg_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    });
  </script>
</body>
</html>
